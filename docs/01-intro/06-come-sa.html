<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>06 · How does Jev "know" things?</title>
<link rel="stylesheet" href="_shared/anim.css">
<!--
  Title slide for section "7. Come fa a sapere le cose?" of the video script (docs/01-intro-jev-video-script.md):
  just the topic, a question mark drawn by hand, and the spoiler that frames steps 1–5.
  Shared base (style, scaling, controls): _shared/anim.css and _shared/anim.js.
-->
<style>
  :root { --loop: 10s; }

  .stage { position: absolute; inset: 0; animation-name: stage; }

  /* ---------- The question mark, drawn by hand ---------- */
  .qmark { position: absolute; left: 900px; top: 150px; width: 120px; height: 230px; overflow: visible; animation-name: wobble; transform-origin: 50% 90%; }
  .qmark path { fill: none; stroke: var(--pink); stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation-name: draw; }
  .qmark circle { fill: var(--pink); transform-origin: 60px 205px; transform: scale(0); animation-name: dot; }

  /* ---------- Title ---------- */
  .title { position: absolute; left: 0; right: 0; top: 440px; text-align: center; font-family: var(--hand); font-size: 104px; line-height: 1.1; opacity: 0; animation-name: title; }
  .title .know { position: relative; display: inline-block; }
  .title .know::after { content: ""; position: absolute; left: -4px; bottom: -6px; height: 12px; width: 0; border-radius: 6px; background: var(--pink); animation-name: underline; animation-duration: var(--loop); animation-iteration-count: infinite; }

  /* ---------- Spoiler ---------- */
  .spoiler { position: absolute; left: 0; right: 0; top: 680px; text-align: center; font-size: 40px; opacity: 0; animation-name: spoiler; }
  .spoiler b { color: var(--pink); }
  .spoiler small { display: block; margin-top: 14px; font-size: 28px; opacity: .6; }

  /* ---------- Timeline (10s loop) ----------
     0–4%    scene in
     4–24%   the question mark is drawn, then its dot pops
     26–30%  "?" wobbles once
     20–26%  title fades up               32–40%  "know" is underlined
     55–60%  spoiler: the knowledge comes from before Jev
     94%     final frame (playback stops here)
     96–100% fade out */
  @keyframes stage { 0% { opacity: 0 } 4%, 96% { opacity: 1 } 100% { opacity: 0 } }
  @keyframes draw { 0%, 4% { stroke-dashoffset: 1 } 20%, 100% { stroke-dashoffset: 0 } }
  @keyframes dot { 0%, 20% { transform: scale(0) } 23% { transform: scale(1.3) } 24.5%, 100% { transform: scale(1) } }
  @keyframes wobble { 0%, 26% { transform: rotate(0) } 27.5% { transform: rotate(-8deg) } 29% { transform: rotate(5deg) } 30.5%, 100% { transform: rotate(0) } }
  @keyframes title { 0%, 20% { opacity: 0; transform: translateY(24px) } 26%, 100% { opacity: 1; transform: none } }
  @keyframes underline { 0%, 32% { width: 0 } 40%, 100% { width: calc(100% + 8px) } }
  @keyframes spoiler { 0%, 55% { opacity: 0; transform: translateY(14px) } 60%, 100% { opacity: 1; transform: none } }
</style>
</head>
<body>
<div class="frame">
  <div class="stage">
    <div class="kicker"><small>Section 6</small>Inside Jev</div>

    <svg class="qmark" viewBox="0 0 120 230" aria-hidden="true">
      <path pathLength="1" d="M18 62 C18 18, 102 8, 102 62 C102 104, 60 104, 60 152" />
      <circle cx="60" cy="205" r="11" />
    </svg>

    <div class="title">How does Jev <span class="know">know</span> things?</div>

    <div class="spoiler">
      Spoiler: the knowledge comes from <b>before Jev</b>.
      <small>Steps 1–4: the language model it's built on · Step 5: Jev's own training</small>
    </div>
  </div>
</div>
<script src="_shared/anim.js"></script>
</body>
</html>
