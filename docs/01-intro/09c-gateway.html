<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>08c · TODO — Use a gateway like Vercel</title>
<link rel="stylesheet" href="_shared/anim.css">
<!--
  PLACEHOLDER title slide for "8. Hands-on" in the video script (docs/01-intro-jev-video-script.md),
  step 3 of 4: Use a gateway like Vercel. To be replaced with the real content.
  Shared base (style, scaling, controls): _shared/anim.css and _shared/anim.js.
-->
<style>
  :root { --loop: 6s; }

  .stage { position: absolute; inset: 0; animation-name: stage; }

  /* ---------- Icon, title, subtitle ---------- */
  .ico { position: absolute; left: 0; right: 0; top: 250px; text-align: center; font-size: 150px; line-height: 1; transform: scale(0); animation-name: ico; }
  .title { position: absolute; left: 0; right: 0; top: 460px; text-align: center; font-family: var(--hand); font-size: 104px; line-height: 1.1; opacity: 0; animation-name: title; }
  .title .key { position: relative; display: inline-block; }
  .title .key::after { content: ""; position: absolute; left: -4px; bottom: -6px; height: 12px; width: 0; border-radius: 6px; background: var(--pink); animation-name: underline; }
  .sub { position: absolute; left: 0; right: 0; top: 650px; text-align: center; font-size: 36px; opacity: 0; animation-name: sub; }

  /* ---------- Progress through the four hands-on steps ---------- */
  .steps { position: absolute; left: 0; right: 0; top: 800px; display: flex; justify-content: center; gap: 18px; opacity: 0; animation-name: sub; }
  .steps i { width: 18px; height: 18px; border-radius: 50%; background: var(--line); border: 2px solid var(--muted); }
  .steps i.done { background: var(--muted); }
  .steps i.on { width: 56px; border-radius: 9px; background: var(--pink); border-color: var(--pink); }

  /* ---------- TODO flag: placeholder, always visible ---------- */
  .todo-frame { position: absolute; inset: 24px; border: 6px dashed var(--red); border-radius: 28px; pointer-events: none; }
  .todo { position: absolute; right: 90px; top: 60px; padding: 10px 34px; border: 8px solid var(--red); border-radius: 18px; color: var(--red); background: var(--red-bg); font-family: var(--sans); font-size: 84px; font-weight: 700; letter-spacing: 6px; line-height: 1; transform: rotate(-6deg); }
  .todo small { display: block; margin-top: 6px; font-size: 22px; font-weight: 600; letter-spacing: 1px; text-align: center; }

  /* ---------- Timeline (6s loop) ----------
     0–4%    scene in             4–14%   icon pops
     12–22%  title fades up       24–36%  key word underlined
     34–44%  subtitle and progress dots
     94%     final frame · 96–100% fade out */
  @keyframes stage { 0% { opacity: 0 } 4%, 96% { opacity: 1 } 100% { opacity: 0 } }
  @keyframes ico { 0%, 4% { transform: scale(0) } 11% { transform: scale(1.15) } 14%, 100% { transform: scale(1) } }
  @keyframes title { 0%, 12% { opacity: 0; transform: translateY(24px) } 22%, 100% { opacity: 1; transform: none } }
  @keyframes underline { 0%, 24% { width: 0 } 36%, 100% { width: calc(100% + 8px) } }
  @keyframes sub { 0%, 34% { opacity: 0; transform: translateY(14px) } 44%, 100% { opacity: 1; transform: none } }
</style>
</head>
<body>
<div class="frame">
  <div class="todo-frame"></div>
  <div class="todo">TODO<small>placeholder slide</small></div>
  <div class="stage">
    <div class="kicker"><small>08 · Hands-on · 3 / 4</small>From theory to practice</div>

    <div class="ico">🌐</div>
    <div class="title">Use a <span class="key">gateway</span> like Vercel</div>
    <div class="sub">One account and one dashboard for every model.</div>
    <div class="steps"><i class="done"></i><i class="done"></i><i class="on"></i><i class=""></i></div>
  </div>
</div>
<script src="_shared/anim.js"></script>
</body>
</html>
