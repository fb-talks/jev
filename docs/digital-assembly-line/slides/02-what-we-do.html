<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>02 · What are we gonna do?</title>
<link rel="stylesheet" href="_shared/anim.css">
<!--
  Slide 02 of the original deck (docs/digital-assembly-line/speaker-notes.md, "02 · What are we gonna do?").
  Left: the question and the goal (a production-ready app built with Google ADK).
  Right: the full architecture of the app we are going to build, revealed layer by layer:
  Sosta Runner, then Suggeritore Runner + AgentTool layer, then the data layer.
  Shared base (style, scaling, controls): _shared/anim.css and _shared/anim.js.
-->
<style>
  :root { --loop: 10s; }

  .stage { position: absolute; inset: 0; animation-name: stage; }

  .eyebrow { position: absolute; left: 135px; top: 120px; font-size: 22px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #8a93a6; opacity: 0; animation-name: fade1; }
  .title { position: absolute; left: 135px; top: 300px; width: 860px; margin: 0; font-family: var(--hand); font-size: 104px; font-weight: 400; line-height: 1.1; }
  .title > span { display: block; opacity: 0; }
  .title .l1 { animation-name: line1; }
  .title .l2 { animation-name: line2; }
  .sub { position: absolute; left: 135px; top: 600px; width: 780px; font-size: 38px; line-height: 1.35; opacity: 0; animation-name: sub; }
  .sub b { color: var(--pink); }

  /* Architecture diagram: the bottom of the image is empty, so the box crops it */
  .diagram { position: absolute; left: 1010px; top: 70px; width: 820px; height: 900px; padding: 20px 24px; opacity: 0; animation-name: diagram; }
  .diagram .clip { position: relative; width: 772px; height: 860px; overflow: hidden; }
  .diagram img { display: block; width: 772px; clip-path: inset(0 0 100% 0); animation-name: reveal; }

  .tag { position: absolute; padding: 8px 18px; border-radius: 999px; background: var(--pink); color: #fff; font-size: 22px; font-weight: 700; opacity: 0; z-index: 2; }
  .t1 { left: 940px; top: 106px; animation-name: t1; }
  .t2 { left: 940px; top: 342px; animation-name: t2; }
  .t3 { left: 940px; top: 690px; animation-name: t3; }

  /* ---------- Timeline (10s loop) ----------
     0–4%    scene in             4–8%   eyebrow
     6–12%   "What are we"        12–18% "gonna do?"         20–28% subtitle (ADK)
     24–28%  diagram card
     28–42%  diagram, layer 1 (Sosta Runner, tag "1 · agents")
     46–62%  layers 2–3 (Suggeritore + AgentTool, tag "2 · A2A + tools")
     66–80%  data layer (tag "3 · data")
     94%     final frame          96–100% fade out */
  @keyframes stage { 0% { opacity: 0 } 4%, 96% { opacity: 1 } 100% { opacity: 0 } }
  @keyframes fade1 { 0%, 4% { opacity: 0 } 8%, 100% { opacity: 1 } }
  @keyframes line1 { 0%, 6% { opacity: 0; transform: translateY(24px) } 12%, 100% { opacity: 1; transform: none } }
  @keyframes line2 { 0%, 12% { opacity: 0; transform: translateY(24px) } 18%, 100% { opacity: 1; transform: none } }
  @keyframes sub { 0%, 20% { opacity: 0 } 26%, 100% { opacity: 1 } }
  @keyframes diagram { 0%, 24% { opacity: 0; transform: translateX(30px) } 28%, 100% { opacity: 1; transform: none } }
  @keyframes reveal {
    0%, 28% { clip-path: inset(0 0 100% 0) }
    42%, 46% { clip-path: inset(0 0 76% 0) }
    62%, 66% { clip-path: inset(0 0 47% 0) }
    80%, 100% { clip-path: inset(0 0 0 0) }
  }
  @keyframes t1 { 0%, 36% { opacity: 0; transform: scale(.8) } 40%, 100% { opacity: 1; transform: none } }
  @keyframes t2 { 0%, 56% { opacity: 0; transform: scale(.8) } 60%, 100% { opacity: 1; transform: none } }
  @keyframes t3 { 0%, 76% { opacity: 0; transform: scale(.8) } 80%, 100% { opacity: 1; transform: none } }
</style>
</head>
<body>
<div class="frame">
  <div class="stage">
    <div class="eyebrow">Google · AI Community 2026</div>
    <h1 class="title"><span class="l1">What are we</span><span class="l2"><span class="underline-pink">gonna do?</span></span></h1>
    <div class="sub">Build a <b>production-ready application</b> using Google Agent Developer Kit (ADK)</div>

    <div class="card diagram"><div class="clip"><img src="_shared/img/architecture.png" alt="Architecture: Sosta Runner (GateKeeper, Registratore, Cameriere), remote A2A to the Suggeritore Runner, AgentTool layer with RoutePlanner, SosteSearch and MenuChecker agents, FastMCP and Vertex AI RAG, Firestore, BigQuery and Cloud Storage"></div></div>
    <div class="tag t1">Sosta Runner</div>
    <div class="tag t2">Suggeritore + AgentTools</div>
    <div class="tag t3">Data layer</div>
  </div>
</div>
<script src="_shared/anim.js"></script>
</body>
</html>
