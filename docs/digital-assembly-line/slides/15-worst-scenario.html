<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>15 · The worst scenario</title>
<link rel="stylesheet" href="_shared/anim.css">
<!--
  Slide 15 of the original deck (docs/digital-assembly-line/speaker-notes.md, "15 · The worst scenario when designing").
  Statement slide: the question to the audience, line by line, "worst scenario" underlined in pink,
  then the question mark wobbles while the audience thinks.
  Shared base (style, scaling, controls): _shared/anim.css and _shared/anim.js.
-->
<style>
  :root { --loop: 8s; }

  .stage { position: absolute; inset: 0; animation-name: stage; }
  .eyebrow { position: absolute; left: 80px; top: 60px; font-size: 20px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: #8a93a6; }

  .q { position: absolute; left: 160px; right: 160px; top: 280px; margin: 0; text-align: center; font-family: var(--hand); font-size: 104px; font-weight: 400; line-height: 1.3; }
  .q span { display: block; opacity: 0; }
  .q .l1 { animation-name: l1; } .q .l2 { animation-name: l2; } .q .l3 { animation-name: l3; }
  .q em { font-style: normal; position: relative; color: var(--pink); }
  .q em::after { content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 9px; border-radius: 5px; background: var(--pink); transform: scaleX(0); transform-origin: left; animation-name: under; }
  .q i { font-style: normal; display: inline-block; color: var(--pink); animation-name: wobble; }

  /* ---------- Timeline (8s loop) ----------
     0–4%    scene in
     6–14%   "What is the most common,"     16–24% "and often worst scenario"     26–34% "when designing?"
     40–52%  "worst scenario" underlined pink
     56–80%  the question mark wobbles, then rests
     94%     final frame (playback stops here)        96–100% fade out */
  @keyframes stage { 0% { opacity: 0 } 4%, 96% { opacity: 1 } 100% { opacity: 0 } }
  @keyframes l1 { 0%, 6% { opacity: 0; transform: translateY(24px) } 14%, 100% { opacity: 1; transform: none } }
  @keyframes l2 { 0%, 16% { opacity: 0; transform: translateY(24px) } 24%, 100% { opacity: 1; transform: none } }
  @keyframes l3 { 0%, 26% { opacity: 0; transform: translateY(24px) } 34%, 100% { opacity: 1; transform: none } }
  @keyframes under { 0%, 40% { transform: scaleX(0) } 52%, 100% { transform: scaleX(1) } }
  @keyframes wobble {
    0%, 56% { transform: none }
    60% { transform: rotate(-14deg) scale(1.15) } 64% { transform: rotate(12deg) scale(1.15) }
    68% { transform: rotate(-8deg) scale(1.1) } 72% { transform: rotate(5deg) } 76%, 100% { transform: none }
  }
</style>
</head>
<body>
<div class="frame">
  <div class="stage">
    <div class="eyebrow">Google · AI Community 2026</div>
    <h1 class="q">
      <span class="l1">What is the most common,</span>
      <span class="l2">and often <em>worst scenario</em></span>
      <span class="l3">when designing<i>?</i></span>
    </h1>
  </div>
</div>
<script src="_shared/anim.js"></script>
</body>
</html>
