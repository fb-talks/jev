<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10 · How to combine Decision Models + LLM</title>
<link rel="stylesheet" href="_shared/anim.css">
<!--
  Section divider for "10. In pratica: Jev + Gemini" in the video script (docs/video-talk/01-intro-jev-video-script.md),
  before 10a. A big centered title, then the two pieces slide in and lock together: the LLM writes (lines of text
  being typed), the decision model decides (a bar and a number, 0.92: illustrative, not measured).
  Shared base (style, scaling, controls): _shared/anim.css and _shared/anim.js.
-->
<style>
  :root { --loop: 12s; }
  @property --n { syntax: "<integer>"; inherits: false; initial-value: 0; }

  .stage { position: absolute; inset: 0; animation-name: stage; }

  /* ---------- Title, in the middle ---------- */
  .eyebrow { position: absolute; left: 0; right: 0; top: 190px; text-align: center; font-size: 30px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #8a93a6; opacity: 0; animation-name: eyebrow; }
  .title { position: absolute; left: 0; right: 0; top: 245px; margin: 0; text-align: center; font-family: var(--hand); font-weight: 400; line-height: 1.12; }
  .title span { display: block; opacity: 0; }
  .t1 { font-size: 96px; animation-name: t1; }
  .t2 { font-size: 132px; animation-name: t2; }
  .t2 em { font-style: normal; color: var(--pink); }

  /* ---------- The two pieces, coming together ---------- */
  .piece { position: absolute; top: 640px; width: 430px; height: 170px; padding: 22px 28px; border-radius: 22px; opacity: 0; }
  .piece small { display: block; margin-bottom: 16px; font-size: 21px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .piece small span { font-weight: 500; opacity: .6; }
  .llm { left: 485px; border: 3px solid var(--blue); background: var(--blue-bg); animation-name: llm; }
  .llm small { color: #0a6fc2; }
  .dm { left: 1005px; border: 3px solid var(--pink); background: var(--pink-bg); animation-name: dm; }
  .dm small { color: var(--pink); }
  .plus { position: absolute; left: 915px; top: 672px; width: 90px; text-align: center; font-family: var(--hand); font-size: 96px; line-height: 1; opacity: 0; animation-name: plus; }
  .verb { position: absolute; top: 830px; width: 430px; text-align: center; font-family: var(--hand); font-size: 52px; opacity: 0; }
  .v1 { left: 485px; animation-name: v1; }
  .v2 { left: 1005px; color: var(--pink); animation-name: v2; }

  /* The LLM writes: three lines typed one after the other */
  .line { height: 14px; margin-bottom: 14px; border-radius: 7px; background: #9cc8f0; transform-origin: left; transform: scaleX(0); }
  .line:nth-of-type(1) { width: 100%; animation-name: line1; }
  .line:nth-of-type(2) { width: 86%; animation-name: line2; }
  .line:nth-of-type(3) { width: 58%; animation-name: line3; }

  /* The decision model decides: a bar fills, its number counts up */
  .answer { display: flex; align-items: center; gap: 20px; margin-top: 6px; }
  .answer .bar { flex: 1; height: 26px; }
  .answer .bar > i { width: 0; animation-name: fill; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  .answer b { width: 110px; text-align: right; font-family: var(--mono); font-size: 46px; font-weight: 500; color: var(--pink); --n: 0; counter-reset: n var(--n); animation-name: count; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  .answer b::before { content: "0." counter(n, decimal-leading-zero); }

  /* ---------- Timeline (12s loop) ----------
     0–4%    scene in
     4–9%    eyebrow "In practice · Jev + Gemini"
     8–14%   "How to combine"        13–20%  "Decision Models + LLM"
     26–32%  LLM piece slides in from the left     29–35%  decision model piece from the right
     34–38%  "+" between them
     38–58%  the LLM types its three lines          44–66%  the bar fills to 0.92, the number counts up
     58–63%  "writes" under the LLM                 66–71%  "decides" under the decision model
     94%     final frame (playback stops here)        96–100% fade out */
  @keyframes stage { 0% { opacity: 0 } 4%, 96% { opacity: 1 } 100% { opacity: 0 } }
  @keyframes eyebrow { 0%, 4% { opacity: 0; letter-spacing: 8px } 9%, 100% { opacity: 1; letter-spacing: 2px } }
  @keyframes t1 { 0%, 8% { opacity: 0; transform: translateY(24px) } 14%, 100% { opacity: 1; transform: none } }
  @keyframes t2 { 0%, 13% { opacity: 0; transform: translateY(24px) scale(.96) } 20%, 100% { opacity: 1; transform: none } }
  @keyframes llm { 0%, 26% { opacity: 0; transform: translateX(-260px) rotate(-3deg) } 32%, 100% { opacity: 1; transform: none } }
  @keyframes dm { 0%, 29% { opacity: 0; transform: translateX(260px) rotate(3deg) } 35%, 100% { opacity: 1; transform: none } }
  @keyframes plus { 0%, 34% { opacity: 0; transform: scale(.3) rotate(-90deg) } 37% { opacity: 1; transform: scale(1.2) } 38%, 100% { opacity: 1; transform: none } }
  @keyframes line1 { 0%, 38% { transform: scaleX(0) } 45%, 100% { transform: scaleX(1) } }
  @keyframes line2 { 0%, 45% { transform: scaleX(0) } 52%, 100% { transform: scaleX(1) } }
  @keyframes line3 { 0%, 52% { transform: scaleX(0) } 58%, 100% { transform: scaleX(1) } }
  @keyframes fill { 0%, 44% { width: 0 } 66%, 100% { width: 92% } }
  @keyframes count { 0%, 44% { --n: 0 } 66%, 100% { --n: 92 } }
  @keyframes v1 { 0%, 58% { opacity: 0; transform: translateY(12px) } 63%, 100% { opacity: 1; transform: none } }
  @keyframes v2 { 0%, 66% { opacity: 0; transform: translateY(12px) } 71%, 100% { opacity: 1; transform: none } }
</style>
</head>
<body>
<div class="frame">
  <div class="stage">
    <div class="eyebrow">In practice · Jev + Gemini</div>
    <h1 class="title"><span class="t1">How to combine</span><span class="t2"><em class="underline-pink">Decision Models</em> + LLM</span></h1>

    <div class="piece llm">
      <small>LLM <span>· e.g. Gemini Flash</span></small>
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
    </div>
    <div class="plus">+</div>
    <div class="piece dm">
      <small>Decision model <span>· e.g. Jev</span></small>
      <div class="answer"><div class="bar"><i></i></div><b></b></div>
    </div>
    <div class="verb v1">writes</div>
    <div class="verb v2">decides</div>
  </div>
</div>
<script src="_shared/anim.js"></script>
</body>
</html>
