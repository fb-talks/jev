<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>06b · Step 2 — Words become coordinates</title>
<link rel="stylesheet" href="_shared/anim.css">
<!--
  Animation for "Step 2" of section 6 of the video script (docs/video-talk/01-intro-jev-video-script.md).
  Shared base (style, scaling, controls): _shared/anim.css and _shared/anim.js.
-->
<style>
  :root { --loop: 12s; }

  .scene { position: absolute; inset: 0; animation-name: scene; }

  /* ---------- Word list (left) ---------- */
  .list { position: absolute; left: 80px; top: 190px; width: 380px; height: 780px; animation-name: list; }
  .list-title { position: absolute; left: 32px; top: 24px; font-size: 22px; font-weight: 600; opacity: .5; }

  /* ---------- 2D space (right) ---------- */
  .plot { position: absolute; left: 520px; top: 170px; width: 1320px; height: 800px; overflow: hidden; }
  .axes { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; }
  .axes .axis { fill: none; stroke: #c7cfdd; stroke-width: 3; stroke-linecap: round; }
  .note { position: absolute; right: 110px; top: 196px; font-size: 20px; color: #6b7385; }

  .zone { position: absolute; border-radius: 50%; transform: scale(.4); opacity: 0; }
  .zone--off { left: 650px; top: 255px; width: 600px; height: 440px; background: radial-gradient(closest-side, rgba(255,0,191,.20), rgba(255,0,191,.06) 75%, transparent); animation-name: zone1; }
  .zone--cor { left: 1270px; top: 600px; width: 500px; height: 320px; background: radial-gradient(closest-side, rgba(13,153,255,.22), rgba(13,153,255,.06) 75%, transparent); animation-name: zone2; }
  .zone-label { position: absolute; font-family: var(--hand); font-size: 38px; opacity: 0; }
  .zone-label--off { left: 690px; top: 250px; color: var(--pink); animation-name: zl1; }
  .zone-label--cor { left: 1300px; top: 596px; color: var(--blue); animation-name: zl2; }

  /* ---------- Words: dot + label, flying from the list to the plot ---------- */
  .w { position: absolute; left: 0; top: 0; z-index: 5; height: 56px; display: flex; align-items: center; gap: 12px; }
  .w .dot { width: 18px; height: 18px; flex: none; border-radius: 50%; background: var(--ink); }
  .w .chip { font-size: 26px; padding: 8px 16px; }
  .w .chip.hand { font-family: var(--hand); font-size: 30px; padding: 6px 16px; border-color: var(--ink); }
  .w.off .dot { animation-name: dot-off; }
  .w.cor .dot { animation-name: dot-cor; }

  .words .w:nth-of-type(1) { animation-name: w1; }
  .words .w:nth-of-type(2) { animation-name: w2; }
  .words .w:nth-of-type(3) { animation-name: w3; }
  .words .w:nth-of-type(4) { animation-name: w4; }
  .words .w:nth-of-type(5) { animation-name: w5; }
  .words .w:nth-of-type(6) { animation-name: w6; }
  .words .w:nth-of-type(7) { animation-name: w7; }
  .words .w:nth-of-type(8) { animation-name: w8; }

  /* ---------- Distances ---------- */
  .dist { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; z-index: 4; }
  .dist path { fill: none; stroke-linecap: round; }
  /* close: short solid pink line, drawn on · far: long dashed grey line, faded in */
  .dist .near { stroke: var(--pink); stroke-width: 5; stroke-dasharray: 1; stroke-dashoffset: 1; animation-name: d1; }
  .dist .far { stroke: var(--muted); stroke-width: 3; stroke-dasharray: .018 .014; opacity: 0; animation-name: d2; }
  .dist-label { position: absolute; z-index: 6; font-size: 24px; opacity: 0; }
  .dist-label--near { left: 718px; top: 428px; border-color: var(--pink); color: var(--pink); animation-name: dl1; }
  .dist-label--far { left: 1140px; top: 598px; color: #6b7385; animation-name: dl2; }

  /* ---------- Caption (left column, after the list leaves) ---------- */
  .caption { position: absolute; left: 80px; top: 400px; width: 400px; opacity: 0; animation-name: caption; }
  .caption .hand { font-size: 60px; line-height: 1.15; }
  .caption .hand b { font-weight: 400; color: var(--pink); }
  .caption p { margin: 22px 0 0; font-size: 26px; line-height: 1.4; opacity: .6; }

  /* ---------- Timeline (12s loop) ----------
     0–3%    list of words + empty 2D space
     8–40%   each word flies to its position (one every 4%), its dot takes the zone colour
     44–56%  the zones appear: "insult zone" (pink), "politeness zone" (blue)
     60–64%  YOU'RE UGLY → "insult": short pink line, "close"
     65–71%  YOU'RE UGLY → "compliments": long dashed grey line, "far"
     42–46%  the list leaves · 74%+ caption: "meaning is position"
     96–100% fade out, loop */
  @keyframes scene { 0% { opacity: 0 } 2%, 96% { opacity: 1 } 100% { opacity: 0 } }
  @keyframes list { 0%, 42% { opacity: 1 } 46%, 100% { opacity: 0 } }

  /* dot centre = target: translate(x - 9px, y - 28px) */
  @keyframes w1 { 0%, 8%  { transform: translate(120px, 240px) } 12%, 100% { transform: translate(811px, 352px) } }
  @keyframes w2 { 0%, 12% { transform: translate(120px, 328px) } 16%, 100% { transform: translate(1391px, 692px) } }
  @keyframes w3 { 0%, 16% { transform: translate(120px, 416px) } 20%, 100% { transform: translate(1011px, 302px) } }
  @keyframes w4 { 0%, 20% { transform: translate(120px, 504px) } 24%, 100% { transform: translate(1571px, 652px) } }
  @keyframes w5 { 0%, 24% { transform: translate(120px, 592px) } 28%, 100% { transform: translate(851px, 492px) } }
  @keyframes w6 { 0%, 28% { transform: translate(120px, 680px) } 32%, 100% { transform: translate(1451px, 792px) } }
  @keyframes w7 { 0%, 32% { transform: translate(120px, 768px) } 36%, 100% { transform: translate(1071px, 442px) } }
  @keyframes w8 { 0%, 36% { transform: translate(120px, 856px) } 40%, 100% { transform: translate(691px, 582px) } }
  @keyframes dot-off { 0%, 40% { background: var(--ink) } 44%, 100% { background: var(--pink) } }
  @keyframes dot-cor { 0%, 50% { background: var(--ink) } 54%, 100% { background: var(--blue) } }

  @keyframes zone1 { 0%, 44% { opacity: 0; transform: scale(.4) } 48%, 100% { opacity: 1; transform: scale(1) } }
  @keyframes zone2 { 0%, 50% { opacity: 0; transform: scale(.4) } 54%, 100% { opacity: 1; transform: scale(1) } }
  @keyframes zl1 { 0%, 46% { opacity: 0 } 49%, 100% { opacity: 1 } }
  @keyframes zl2 { 0%, 52% { opacity: 0 } 55%, 100% { opacity: 1 } }

  @keyframes d1 { 0%, 60% { stroke-dashoffset: 1 } 63%, 100% { stroke-dashoffset: 0 } }
  @keyframes d2 { 0%, 65% { opacity: 0 } 69%, 100% { opacity: 1 } }
  @keyframes dl1 { 0%, 62% { opacity: 0 } 64%, 100% { opacity: 1 } }
  @keyframes dl2 { 0%, 69% { opacity: 0 } 71%, 100% { opacity: 1 } }

  @keyframes caption { 0%, 74% { opacity: 0; transform: translateY(14px) } 78%, 100% { opacity: 1; transform: none } }
</style>
</head>
<body>
<div class="frame">
  <div class="scene">
    <div class="kicker"><small>Step 2</small>Words become coordinates</div>

    <div class="list card"><span class="list-title">Words</span></div>

    <div class="plot card"></div>
    <svg class="axes" viewBox="0 0 1920 1080" aria-hidden="true">
      <path class="axis" d="M580 920 L1790 920 M1778 910 L1790 920 L1778 930" />
      <path class="axis" d="M580 920 L580 240 M570 252 L580 240 L590 252" />
    </svg>
    <span class="note chip">2D for simplicity · really thousands of dimensions</span>

    <div class="zone zone--off"></div>
    <div class="zone zone--cor"></div>
    <span class="zone-label zone-label--off">insult zone</span>
    <span class="zone-label zone-label--cor">politeness zone</span>

    <svg class="dist" viewBox="0 0 1920 1080" aria-hidden="true">
      <path class="near" pathLength="1" d="M860 520 L820 380" />
      <path class="far" pathLength="1" d="M860 520 L1460 820" />
    </svg>
    <span class="dist-label dist-label--near chip">close</span>
    <span class="dist-label dist-label--far chip">far</span>

    <div class="words">
    <div class="w off"><i class="dot"></i><span class="chip">insult</span></div>
    <div class="w cor"><i class="dot"></i><span class="chip">kind</span></div>
    <div class="w off"><i class="dot"></i><span class="chip">idiot</span></div>
    <div class="w cor"><i class="dot"></i><span class="chip">thanks</span></div>
    <div class="w off"><i class="dot"></i><span class="chip hand">YOU'RE UGLY</span></div>
    <div class="w cor"><i class="dot"></i><span class="chip">compliments</span></div>
    <div class="w off"><i class="dot"></i><span class="chip">stupid</span></div>
    <div class="w off"><i class="dot"></i><span class="chip">offensive</span></div>
    </div>

    <div class="caption">
      <div class="hand">Meaning is <b>position</b>.</div>
      <p>And it learned each position from context.</p>
    </div>
  </div>
</div>
<script src="_shared/anim.js"></script>
</body>
</html>
