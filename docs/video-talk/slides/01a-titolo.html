<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>01a · Jev</title>
<link rel="stylesheet" href="_shared/anim.css">
<!--
  Title slide of the talk, before the hook (docs/01-intro-jev-video-script.md, "Apertura").
  "Jev" is written, a probability bar fills to 92% under it, the four question types drop in around it,
  then the tagline. 0.92 is the urgent ticket of 03e, used here only as a symbol.
  Shared base (style, scaling, controls): _shared/anim.css and _shared/anim.js.
-->
<style>
  :root { --loop: 9s; }

  @property --n { syntax: "<integer>"; inherits: false; initial-value: 0; }

  .stage { position: absolute; inset: 0; animation-name: stage; }

  /* ---------- The name, written by hand: the pen draws the outline, a soft edge uncovers it
     from left to right, then the ink fills it ---------- */
  .name { position: absolute; left: 510px; top: 210px; width: 900px; height: 380px; overflow: visible;
    -webkit-mask-image: linear-gradient(90deg, #000 42%, transparent 58%); mask-image: linear-gradient(90deg, #000 42%, transparent 58%);
    -webkit-mask-size: 240% 100%; mask-size: 240% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    animation-name: wipe; animation-timing-function: cubic-bezier(.45,.05,.55,.95); }
  .name text { font-family: var(--hand); font-size: 300px; fill: var(--ink); fill-opacity: 0; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 1600; stroke-dashoffset: 1600; animation-name: pen, ink; animation-timing-function: ease-in-out, ease-out; }

  /* ---------- One answer, as a number ---------- */
  .answer { position: absolute; left: 610px; top: 610px; width: 700px; display: flex; align-items: center; gap: 28px; opacity: 0; animation-name: answer; }
  .answer .bar { flex: 1; height: 30px; }
  .answer .bar > i { width: 0; animation-name: fill; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  .answer b { width: 150px; text-align: right; font-family: var(--mono); font-size: 56px; font-weight: 500; color: var(--pink); --n: 0; counter-reset: n var(--n); animation-name: count; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  .answer b::before { content: "0." counter(n, decimal-leading-zero); }

  /* ---------- The four question types, around the name ---------- */
  .chip { position: absolute; font-family: var(--mono); font-size: 30px; font-weight: 500; opacity: 0; }
  .c1 { left: 400px; top: 230px; rotate: -8deg; animation-name: c1; }
  .c2 { left: 1380px; top: 260px; rotate: 6deg; animation-name: c2; }
  .c3 { left: 440px; top: 470px; rotate: 5deg; animation-name: c3; }
  .c4 { left: 1360px; top: 480px; rotate: -5deg; animation-name: c4; border-color: var(--pink); color: var(--pink); }

  /* ---------- Tagline ---------- */
  .tag { position: absolute; left: 0; right: 0; top: 760px; text-align: center; font-family: var(--hand); font-size: 64px; opacity: 0; animation-name: tag; }
  .sub { position: absolute; left: 0; right: 0; top: 870px; text-align: center; font-size: 26px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; opacity: 0; animation-name: sub; }
  .sub span { opacity: .45; }

  /* ---------- Timeline (9s loop) ----------
     0–4%    scene in        4–20%  "Jev" is written: outline drawn while it is uncovered left to right
     14–24%  the ink fills the letters
     22–26%  the bar appears           26–44%  it fills to 92%, the number counts up
     40–58%  noul, choice, score, box drop in around the name, one every 6%
     64–70%  tagline        72–78%  subtitle
     94%     final frame (playback stops here)        96–100% fade out */
  @keyframes stage { 0% { opacity: 0 } 4%, 96% { opacity: 1 } 100% { opacity: 0 } }
  @keyframes wipe { 0%, 4% { -webkit-mask-position: 100% 0; mask-position: 100% 0 } 20%, 100% { -webkit-mask-position: 0 0; mask-position: 0 0 } }
  @keyframes pen { 0%, 4% { stroke-dashoffset: 1600 } 22%, 100% { stroke-dashoffset: 0 } }
  @keyframes ink { 0%, 14% { fill-opacity: 0; stroke-width: 5 } 24%, 100% { fill-opacity: 1; stroke-width: 0 } }
  @keyframes answer { 0%, 22% { opacity: 0; transform: translateY(14px) } 26%, 100% { opacity: 1; transform: none } }
  @keyframes fill { 0%, 26% { width: 0 } 44%, 100% { width: 92% } }
  @keyframes count { 0%, 26% { --n: 0 } 44%, 100% { --n: 92 } }
  @keyframes c1 { 0%, 40% { opacity: 0; transform: translateY(-30px) } 44% { opacity: 1; transform: translateY(4px) } 46%, 100% { opacity: 1; transform: none } }
  @keyframes c2 { 0%, 46% { opacity: 0; transform: translateY(-30px) } 50% { opacity: 1; transform: translateY(4px) } 52%, 100% { opacity: 1; transform: none } }
  @keyframes c3 { 0%, 52% { opacity: 0; transform: translateY(-30px) } 56% { opacity: 1; transform: translateY(4px) } 58%, 100% { opacity: 1; transform: none } }
  @keyframes c4 { 0%, 58% { opacity: 0; transform: translateY(-30px) } 62% { opacity: 1; transform: translateY(4px) } 64%, 100% { opacity: 1; transform: none } }
  @keyframes tag { 0%, 64% { opacity: 0; transform: translateY(14px) } 70%, 100% { opacity: 1; transform: none } }
  @keyframes sub { 0%, 72% { opacity: 0 } 78%, 100% { opacity: 1 } }
</style>
</head>
<body>
<div class="frame">
  <div class="stage">
    <svg class="name" viewBox="0 0 900 380"><text x="450" y="300" text-anchor="middle">Jev</text></svg>

    <div class="answer"><div class="bar"><i></i></div><b></b></div>

    <span class="chip c1">noul</span>
    <span class="chip c2">choice</span>
    <span class="chip c3">score</span>
    <span class="chip c4">box</span>

    <div class="tag">It doesn't write. <span class="underline-pink">It decides.</span></div>
    <div class="sub">TypeSafe AI <span>·</span> a System One model</div>
  </div>
</div>
<script src="_shared/anim.js"></script>
</body>
</html>
